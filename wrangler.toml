name = "thicket"
main = "worker/index.js"
compatibility_date = "2026-10-28"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "thicket-diary"
database_id = "85b402ca-2a50-4326-a506-942e90208662"
migrations_dir = "migrations"

[observability]
enabled = true