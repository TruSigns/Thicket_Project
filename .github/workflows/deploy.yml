name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you re-run a deploy by hand from the Actions tab

# Never run two deploys at once; a newer push waits for the current one
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  SITE_URL: https://thicket.stephfan-maurice-ruffin.workers.dev
  D1_DATABASE: thicket-diary

jobs:
  deploy:
    name: Check, migrate, deploy, verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Fail fast if Cloudflare credentials are missing
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must be set as repository secrets"
            exit 1
          fi

      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Apply database migrations
        run: npx wrangler d1 migrations apply "$D1_DATABASE" --remote

      - name: Deploy Worker
        run: npx wrangler deploy

      - name: Smoke test
        run: |
          response=$(curl --fail --silent --show-error \
            --retry 5 --retry-delay 3 --retry-all-errors \
            "$SITE_URL/api/posts")
          echo "$response" | grep -q '"posts"' || {
            echo "::error::/api/posts did not return a posts list"
            echo "$response"
            exit 1
          }
          echo "Smoke test passed"
